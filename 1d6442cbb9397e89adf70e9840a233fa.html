    if (document.getElementById("r").checked) store((s) => s.setItem(storageKey, result.key));
    else store((s) => s.removeItem(storageKey));
    await show(result.html);
  } catch {
    error.textContent = "That password didn't work.";
    button.disabled = false;
  }
});
</script>
</body>
</html>
