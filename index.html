<script>(() => {
  const root = document.documentElement;
  const icons = {
    auto: '<circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/>',
    light: '<circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3"/>',
    dark: '<path d="M13.5 9.5A5.5 5.5 0 1 1 6.5 2.5a4.5 4.5 0 0 0 7 7z"/>',
  };
  const labels = { auto: "Theme: match system", light: "Theme: light", dark: "Theme: dark" };
  const next = { auto: "light", light: "dark", dark: "auto" };
  const button = document.createElement("button");
  button.className = "theme-toggle";
  const render = () => {
    const mode = root.dataset.theme || "auto";
    button.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">' + icons[mode] + "</svg>";
    button.title = labels[mode];
    button.setAttribute("aria-label", labels[mode]);
  };
  button.addEventListener("click", () => {
    const mode = next[root.dataset.theme || "auto"];
    if (mode === "auto") delete root.dataset.theme;
    else root.dataset.theme = mode;
    try {
      if (mode === "auto") localStorage.removeItem("md-viewer-theme");
      else localStorage.setItem("md-viewer-theme", mode);
    } catch {} // storage blocked: the choice lasts for this visit
    render();
  });
  render();
  document.body.appendChild(button);
})();</script>
<script>(() => {
  const headings = [...document.querySelectorAll("main h1, main h2, main h3, main h4")];
  if (headings.length < 2) return;
  const top = Math.min(...headings.map((h) => +h.tagName[1]));
  const widths = [28, 22, 16, 12];
  const nav = document.createElement("nav");
  nav.className = "page-outline";
  nav.setAttribute("aria-label", "Outline");
  const list = document.createElement("ol");
  const buttons = headings.map((h) => {
    const depth = +h.tagName[1] - top;
    const item = document.createElement("li");
    const button = document.createElement("button");
    const dash = document.createElement("span");
    dash.className = "po-dash";
    dash.style.width = widths[depth] + "px";
    dash.style.marginRight = (widths[0] - widths[depth]) + "px";
    const text = document.createElement("span");
    text.className = "po-text";
    text.textContent = h.textContent.trim();
    text.style.setProperty("--po-indent", depth * 16 + "px");
    button.title = text.textContent;
    button.append(dash, text);
    button.addEventListener("click", () => h.scrollIntoView({ behavior: "smooth", block: "start" }));
    item.append(button);
    list.append(item);
    return button;
  });
  const toggle = document.createElement("button");
  toggle.className = "po-toggle";
  toggle.setAttribute("aria-label", "Outline");
  toggle.setAttribute("aria-expanded", "false");
  toggle.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h6"/></svg>';
  const setOpen = (open) => {
    nav.classList.toggle("open", open);
    toggle.setAttribute("aria-expanded", String(open));
  };
  toggle.addEventListener("click", () => setOpen(!nav.classList.contains("open")));
  list.addEventListener("click", () => setOpen(false));
  document.addEventListener("click", (e) => { if (!nav.contains(e.target)) setOpen(false); });
  nav.append(toggle, list);
  document.body.append(nav);
  // The current section: the last heading scrolled past the top (the first
  // before any), or the last one once the page is scrolled to the end.
  let queued = false;
  const update = () => {
    queued = false;
    let current = 0;
    headings.forEach((h, i) => { if (h.getBoundingClientRect().top <= 96) current = i; });
    if (innerHeight + scrollY >= document.documentElement.scrollHeight - 2) current = headings.length - 1;
    buttons.forEach((b, i) => b.setAttribute("aria-current", String(i === current)));
  };
  addEventListener("scroll", () => { if (!queued) { queued = true; requestAnimationFrame(update); } }, { passive: true });
  update();
})();</script>
<script>(() => {
  const first = [...document.querySelectorAll("main > *")].find((el) => !el.classList.contains("frontmatter"));
  if (!first || first.tagName !== "H1") return;
  const bar = document.createElement("div");
  bar.className = "page-title-bar";
  bar.setAttribute("aria-hidden", "true");
  const text = document.createElement("span");
  text.textContent = first.textContent.trim();
  bar.append(text);
  bar.addEventListener("click", () => scrollTo({ top: 0, behavior: "smooth" }));
  document.body.append(bar);
  new IntersectionObserver(([entry]) => {
    bar.classList.toggle("shown", !entry.isIntersecting && entry.boundingClientRect.top < 0);
  }).observe(first);
})();</script>
