<script>
const decryptPayload = async function ofe(t,e,n){const r=u=>Uint8Array.from(atob(u),f=>f.charCodeAt(0)),i=n?await crypto.subtle.importKey("raw",r(n),"AES-GCM",!0,["decrypt"]):await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:r(t.salt),iterations:t.iter},await crypto.subtle.importKey("raw",new TextEncoder().encode(e),"PBKDF2",!1,["deriveKey"]),{name:"AES-GCM",length:256},!0,["decrypt"]),o=await crypto.subtle.decrypt({name:"AES-GCM",iv:r(t.iv)},i,r(t.ct));let l="";for(const u of new Uint8Array(await crypto.subtle.exportKey("raw",i)))l+=String.fromCharCode(u);return{html:new TextDecoder().decode(o),key:btoa(l)}};
const payload = JSON.parse(document.getElementById("d").textContent);
const storageKey = "md-viewer-page:" + location.pathname;
const form = document.getElementById("f");
const show = async (html) => {
  // Replacing the page only works once it has finished loading; a remembered

  if (document.readyState === "loading") {
