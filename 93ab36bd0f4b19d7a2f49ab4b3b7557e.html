const decryptPayload = async function SJ(t,e,n){const i=o=>Uint8Array.from(atob(o),c=>c.charCodeAt(0)),r=n?await crypto.subtle.importKey("raw",i(n),"AES-GCM",!0,["decrypt"]):await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:i(t.salt),iterations:t.iter},await crypto.subtle.importKey("raw",new TextEncoder().encode(e),"PBKDF2",!1,["deriveKey"]),{name:"AES-GCM",length:256},!0,["decrypt"]),s=await crypto.subtle.decrypt({name:"AES-GCM",iv:i(t.iv)},r,i(t.ct));let l="";for(const o of new Uint8Array(await crypto.subtle.exportKey("raw",r)))l+=String.fromCharCode(o);return{html:new TextDecoder().decode(s),key:btoa(l)}};
