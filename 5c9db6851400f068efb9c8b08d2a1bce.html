<script>
const decryptPayload = async function decryptPayload(payload, password) {
  const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({
    name: "PBKDF2",
    hash: "SHA-256",
    salt: bytes(payload.salt),
    iterations: payload.iter
  }, base, {
    name: "AES-GCM",
    length: 256
  }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({
    name: "AES-GCM",
    iv: bytes(payload.iv)
  }, key, bytes(payload.ct));
  return new TextDecoder().decode(plain);
};
document.getElementById("f").addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = document.getElementById("b");
  const error = document.getElementById("e");
  button.disabled = true;
  error.textContent = "";
  try {
    const payload = JSON.parse(document.getElementById("d").textContent);
    const html = await decryptPayload(payload, document.getElementById("p").value);
    document.open();
    document.write(html);
    document.close();
  } catch {
    error.textContent = "That password didn't work.";
    button.disabled = false;
  }
});
</script>
